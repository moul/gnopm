name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Full history: the integration test builds a git repository and the
      # tool itself resolves pinned commits, so a shallow clone is not enough.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24"
          # gnopm has no dependencies, so there is no go.sum for the cache to
          # key on, and setup-go's default of true only ever prints
          # "Restore cache failed: Dependencies file is not found".
          cache: false
      - run: go build ./...
      - run: go vet ./...
      - run: gofmt -l . | tee /tmp/fmt && test ! -s /tmp/fmt
      - run: go test ./...

  # staticcheck on its own job, with its own Go, and BOTH pinned.
  #
  # It is squeezed from two sides. It has to be built with a toolchain at least
  # as new as the module's `go` directive or it refuses to analyse it, which
  # rules out the 1.24 the rest of CI pins. And it cannot read export data from
  # a toolchain newer than the one it was built against, so `go-version:
  # stable` fails the day the runner moves ahead of the release:
  #
  #   internal error in importing "math/bits" (export data version 4 is
  #   greater than maximum supported version 2)
  #
  # So the analyser version and the Go that builds it are pinned together and
  # move together. Pinning also keeps a new staticcheck release from turning
  # main red on a day nobody touched the code.
  #
  # staticcheck.conf says which checks are on and why.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: false
      - run: go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
      - run: staticcheck ./...

  # The integration test is also the demo: it builds a whole workspace from
  # nothing and asserts at every step. Running it on its own makes a failure
  # here obvious rather than buried in the unit test output. It is also where
  # `gnopm tool ci` is executed rather than merely recommended: that command is
  # what every adopting repository's workflow calls, so a regression in it would
  # otherwise reach them before it reached us.
  #
  # On macOS as well as Linux, because this is the part of the project that
  # leaves Go: it drives git, grep, sed and awk through a shell, and half of
  # this is written on a machine where those are the BSD ones. `go test` cannot
  # see a portability break in a shell script.
  demo:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24"
          cache: false
      - run: ./scripts/demo.sh "${{ runner.temp }}/gnopm-demo"

  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24"
          cache: false
      # Prove the documented install path works against this tree.
      - run: go install ./... && gnopm version

  # The action, exercised rather than described. An action nobody runs in CI is
  # an action that breaks on the day somebody adopts it, and the half most
  # likely to break is the RUNNER_OS/RUNNER_ARCH to asset-name table, which can
  # only be wrong per platform. Both runners, both spellings.
  #
  # `version` is passed explicitly because `github.action_ref` is empty for a
  # local `uses: ./`, and passing a real released tag is what makes this test
  # the download path rather than the fallback.
  action:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24"
          cache: false
      # A workspace to run against: this repository is gnopm's source, not a
      # gno workspace, so the demo builds one the way it does everywhere else.
      - run: ./scripts/demo.sh "${{ runner.temp }}/ws"
      - uses: ./
        with:
          version: v0.13.0
          working-directory: ${{ runner.temp }}/ws
          args: tool ci
      # The fallback has to work too, or an unreleased ref and every Windows
      # runner fail on the day they are first used. A branch ref has no release
      # behind it, so this takes the `go install` path by construction.
      - uses: ./
        with:
          version: main
          working-directory: ${{ runner.temp }}/ws
          args: status
