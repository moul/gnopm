<text x="391.5" y="21.5" fill="#8b949e" text-anchor="middle" font-size="12">gnopm doc: the bump, as the two signatures side by side</text>
<text x="18" y="56" fill="#7ee787">$</text>
<text x="34.8" y="56" fill="#d2a8ff">gnopm doc p/demo/strs/v1</text>
<text x="18" y="76" fill="#c9d1d9" xml:space="preserve">package strs // import &quot;gno.land/p/demo/strs/v1&quot;</text>
<text x="18" y="116" fill="#8b949e" xml:space="preserve">    Package strs is a leaf: it imports nothing.</text>
<text x="18" y="156" fill="#c9d1d9" xml:space="preserve">func Repeat(s string, n int) (string, error)</text>
<text x="18" y="196" fill="#7ee787">$</text>
<text x="34.8" y="196" fill="#d2a8ff">gnopm doc gno.land/p/demo/table/v0 Rule</text>
<text x="18" y="216" fill="#c9d1d9" xml:space="preserve">gno.land/p/demo/table/v0 has no directory: read from the assembly, pinned at 4cf5f5ac334c</text>
<text x="18" y="236" fill="#c9d1d9" xml:space="preserve">func Rule(width int) string</text>
<text x="18" y="276" fill="#8b949e" xml:space="preserve">    Rule returns a horizontal rule of the given width.</text>
