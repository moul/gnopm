<text x="18" y="376" fill="#8b949e" xml:space="preserve">    Rule returns a horizontal rule of the given width.</text>
<text x="18" y="416" fill="#8b949e" xml:space="preserve">    v1 CHANGED: it moved to strs/v1, whose Repeat returns an error, so Rule now</text>
