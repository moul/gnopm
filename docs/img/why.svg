<svg xmlns="http://www.w3.org/2000/svg" width="590" height="310" viewBox="0 0 590 310" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">
<rect width="590" height="310" rx="10" fill="#11131a"/>
<rect width="590" height="34" rx="10" fill="#0d1117"/>
<rect y="24" width="590" height="10" fill="#0d1117"/>
<circle cx="18" cy="17.0" r="5.5" fill="#ff5f56"/>
<circle cx="36" cy="17.0" r="5.5" fill="#ffbd2e"/>
<circle cx="54" cy="17.0" r="5.5" fill="#27c93f"/>
<text x="295.0" y="21.5" fill="#8b949e" text-anchor="middle" font-size="12">gnopm why: the importer with no directory</text>
<text x="18" y="56" fill="#7ee787">$</text>
<text x="34.8" y="56" fill="#d2a8ff">gnopm why gno.land/p/demo/strs/v1</text>
<text x="18" y="76" fill="#c9d1d9" xml:space="preserve">gno.land/p/demo/table/v1 imports gno.land/p/demo/strs/v1</text>
<text x="18" y="96" fill="#c9d1d9" xml:space="preserve">gno.land/r/demo/board/v0 imports gno.land/p/demo/strs/v1</text>
<text x="18" y="136" fill="#7ee787">$</text>
<text x="34.8" y="136" fill="#d2a8ff">gnopm why gno.land/p/demo/strs/v0</text>
<text x="18" y="156" fill="#c9d1d9" xml:space="preserve">gno.land/p/demo/table/v0 imports gno.land/p/demo/strs/v0</text>
<text x="18" y="196" fill="#8b949e" xml:space="preserve"># table/v0 has no directory. It is pinned to history:</text>
<text x="18" y="216" fill="#7ee787">$</text>
<text x="34.8" y="216" fill="#d2a8ff">gnopm ls</text>
<text x="18" y="236" fill="#c9d1d9" xml:space="preserve">MODULE                          SOURCE   LOCATION</text>
<text x="18" y="256" fill="#c9d1d9" xml:space="preserve">gno.land/p/demo/table/v0        history  4cf5f5ac334c:p/demo/table</text>
<text x="18" y="276" fill="#c9d1d9" xml:space="preserve">gno.land/p/demo/table/v1        tree     p/demo/table</text>
</svg>
