# staticcheck's defaults, with three style checks turned back ON and one off.
#
# ON, because each caught real drift the first time it ran:
#   ST1000  a package needs a doc comment. pkg/gnopm is documented in the
#           README as importable, so it earns one.
#   ST1020  an exported function's comment starts with its name. Half a dozen
#           here still named cmdStatus, cmdLs and cmdSync, functions that were
#           renamed and whose comments were not. A comment naming something
#           that no longer exists is worse than no comment.
#   ST1021  the same, for exported types.
#
# OFF, deliberately:
#   ST1005  wants an error string to be one lowercase phrase with no trailing
#           punctuation. gnopm writes the opposite on purpose: an error names
#           the fix, which usually takes a second sentence and sometimes a
#           second line ("gnomod.lock is stale: ... Run `gnopm sync`"). That
#           rule is in CONTRIBUTING.md under Style. Keeping ST1005 would mean
#           losing it or annotating every such error, so it is off here once,
#           with the reason.
#
# The rest are staticcheck's own defaults, listed rather than inherited so that
# reading this file tells you the whole configuration.
checks = ["all", "-ST1003", "-ST1005", "-ST1016", "-ST1022", "-ST1023"]
